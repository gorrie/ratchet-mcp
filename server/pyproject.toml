[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Ratchet Revolving Door dataset. See https://github.com/gorrie/ratchet-mcp for the full README, dataset and scope docs."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ian Gorrie" }]
keywords = ["mcp", "model-context-protocol", "influence-mapping", "osint"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Sociology",
]
dependencies = [
  # Deliberately unbounded again. The `<2` bound existed because mcp 2.0.0 (2026-07-28)
  # removed `mcp.server.fastmcp`; server.py now imports MCPServer from
  # mcp.server.mcpserver and falls back to the 1.x class, so BOTH generations work and
  # neither needs pinning. Verified on 2.0.0 and on 1.x: 58 passed, 100% coverage each.
  # Keep it open — this package is installed by other people, and a bound we do not need
  # would drag them back to a superseded SDK.
  "mcp>=1.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
ratchet-mcp = "ratchet_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ratchet_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
