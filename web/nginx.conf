server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # JSONL files served as application/jsonl with explicit CORS for local dev.
  location /data/ {
    default_type application/jsonl;
    add_header Access-Control-Allow-Origin *;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
