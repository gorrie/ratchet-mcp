name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Citation + defamation audit
        working-directory: server
        run: python tests/audit_citations.py

      - name: Unit tests
        working-directory: server
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: audit-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t ratchet-mcp:ci server
      - name: Build web image
        run: docker build -t ratchet-web:ci web
      - name: Compose config validates
        run: docker compose config -q
