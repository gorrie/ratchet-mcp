name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Citation + defamation audit
        working-directory: server
        run: python tests/audit_citations.py

      - name: Fetch tradecraft (texts-lane dependency)
        run: |
          git clone --depth 1 https://github.com/gorrie/tradecraft.git "$RUNNER_TEMP/tradecraft"
          pip install -r "$RUNNER_TEMP/tradecraft/requirements.txt"

      - name: Unit tests + 100% coverage gate
        working-directory: server
        env:
          TRADECRAFT_PATH: ${{ runner.temp }}/tradecraft
        run: pytest -q --cov=ratchet_mcp --cov-report=term-missing --cov-fail-under=100

  docker-build:
    runs-on: ubuntu-latest
    needs: audit-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t ratchet-mcp:ci server
      - name: Build web image
        run: docker build -t ratchet-web:ci web
      - name: Compose config validates
        run: docker compose config -q
