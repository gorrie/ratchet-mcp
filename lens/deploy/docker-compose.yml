# Local self-host for the Tradecraft Lens. One command: `docker compose up --build`.
# Two backends for grading, pick either:
#   - LOCAL (no key): the ollama service below; pull a model once (see README), Lens uses backend=auto -> local.
#   - CLOUD: set OPENROUTER_API_KEY in the environment (or a .env beside this file); auto prefers it.
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  lens:
    build:
      context: ../../../..            # evil-robots-series root
      dockerfile: research/ratchet-mcp/lens/deploy/Dockerfile
    ports: ["8770:8770"]
    environment:
      - OLLAMA_BASE=http://ollama:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LENS_PORT=8770
    depends_on: ["ollama"]
    restart: unless-stopped

volumes:
  ollama: {}
